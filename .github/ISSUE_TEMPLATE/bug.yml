name: Bug report
description: Report a reproducible problem in an app, package, or the suite
title: "[scope] "
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of Shedflare is affected?
      options:
        - Anki
        - Auth
        - CF Bill
        - Chat
        - Discord
        - Drive
        - Homepage
        - Links
        - Money
        - Observability
        - Routines
        - Site
        - CLI or Console
        - Shared package
        - Suite or cross-cutting
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, Node/pnpm versions, stage type, and relevant browser or OS.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed secrets, tokens, account IDs, and private user data from this report.
          required: true
