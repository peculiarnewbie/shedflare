name: Feature request
description: Propose an app-specific or cross-cutting improvement
title: "[scope] "
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Anki
        - Auth
        - CF Bill
        - Chat
        - Discord
        - Drive
        - Homepage
        - Links
        - Money
        - Observability
        - Routines
        - Site
        - CLI or Console
        - Shared package
        - Suite or cross-cutting
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem or workflow, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what success looks like and any important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope boundaries
      description: Note whether this should stay app-local or needs a shared contract.
