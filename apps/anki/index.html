<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3ead7" />
    <title>Shedflare Anki</title>
    <script>
      (() => {
        const href =
          "https://fonts.googleapis.com/css2?family=Alegreya:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap";
        const google = document.createElement("link");
        google.rel = "preconnect";
        google.href = "https://fonts.googleapis.com";
        document.head.append(google);
        const staticHost = document.createElement("link");
        staticHost.rel = "preconnect";
        staticHost.href = "https://fonts.gstatic.com";
        staticHost.crossOrigin = "";
        document.head.append(staticHost);
        const font = document.createElement("link");
        font.rel = "stylesheet";
        font.href = href;
        document.head.append(font);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
